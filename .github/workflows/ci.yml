name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Install Phoenix dependencies
        working-directory: services/quizworld_realtime
        run: mix deps.get

      # Component identity regressions run in Chromium with synthetic transport;
      # unlike production E2E, they also run on pull requests.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run deterministic verification
        run: npm run check
        env:
          # Embedded at build time: local fixture lookups must not reach live rooms.
          NEXT_PUBLIC_GAME_SERVICE_URL: https://quizworld-ux-test.invalid
          # Non-secret SDK configuration, not a live Supabase project. These
          # public values must exist during next build, not only next start.
          NEXT_PUBLIC_SUPABASE_URL: https://quizworld-local-fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_local_fixture_not_a_real_key

      - name: Verify E2E project selection
        run: node --test scripts/e2e-selection.test.cjs

      - name: Verify safe E2E evidence retention
        run: node --test scripts/e2e-evidence.test.cjs

      # Runs on PRs and pushes, against the build produced by npm run check.
      # Playwright owns the loopback server and shuts it down on either outcome.
      - name: Run local fixture E2E tests
        id: local_e2e
        run: npx playwright test --config=playwright.local.config.ts --project=local-fixtures

      - name: Upload safe local fixture evidence
        uses: actions/upload-artifact@v4
        if: always() && (steps.local_e2e.outcome == 'success' || steps.local_e2e.outcome == 'failure')
        with:
          name: local-e2e-evidence
          path: e2e-evidence/summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Run production E2E tests
        id: e2e
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx playwright test --project=chromium
        env:
          BASE_URL: https://www.quizworld.xyz
      
      # Recovered retries exit successfully. Publish only the safe summary on
      # either outcome, never raw test-results, HTML, screenshots or traces.
      - name: Upload safe E2E evidence
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure')
        with:
          name: e2e-evidence
          path: e2e-evidence/summary.json
          if-no-files-found: error
          retention-days: 7